[project]
name = "wistia-video-analytics"
version = "0.1.0"
description = "AWS data engineering pipeline for Wistia video analytics"
requires-python = ">=3.10"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
